[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tnglens"
version = "0.1.0"
description = "Lens maps, multiple-image catalogs and truth tables from TNG-Cluster halos"
requires-python = ">=3.11"
license = {text = "BSD-3-Clause"}
dependencies = ["numpy", "scipy", "h5py", "astropy", "pyyaml", "py-sphviewer2>=2.0.3"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
tnglens = "tnglens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
